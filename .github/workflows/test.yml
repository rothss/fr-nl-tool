name: Tests

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # Daily at 02:00 Beijing time

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile Python files
      run: |
        python -m py_compile scripts/runner.py
        python -m py_compile scripts/e2e/*.py
        python -m py_compile tests/test_page_export_consistency.py
        python -m py_compile tests/mock_fr_server/server.py

    - name: Run tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v
      env:
        FR_MIRROR_ROOT: ./test_mirror
        FR_BASE_URL: http://localhost:8080

  mock-page-export:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas  # required by mock server fixtures

    - name: Compile Python files
      run: |
        python -m py_compile scripts/runner.py
        python -m py_compile scripts/e2e/*.py
        python -m py_compile tests/test_page_export_consistency.py
        python -m py_compile tests/mock_fr_server/server.py

    - name: Run page-export consistency unit tests
      run: |
        python -m unittest tests.test_page_export_consistency -v

    - name: Install Playwright
      run: |
        pip install playwright
        python -m playwright install chromium --with-deps

    - name: Start mock FR server
      run: |
        python tests/mock_fr_server/server.py --port 18080 &
        sleep 2

    - name: Run verify-export with mock prefix-ordered case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_prefix_ordered.json \
          --artifacts test-results/page_export/mock_prefix \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export with mock visible-subset case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_visible_subset.json \
          --artifacts test-results/page_export/mock_subset \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export with mock current-page-equal case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_current_page_equal.json \
          --artifacts test-results/page_export/mock_current_page \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export negative case (value mismatch → must FAIL)
      run: |
        set +e
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_value_diff.json \
          --artifacts test-results/page_export/mock_value_diff \
          --output-format json
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          echo "FAIL: expected mock_sales_value_diff to fail but it passed"
          exit 1
        fi
        echo "Negative case value_diff failed as expected"
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export negative case (extra rows in current_page_equal → must FAIL)
      run: |
        set +e
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_extra_export_rows_fail.json \
          --artifacts test-results/page_export/mock_extra_rows \
          --output-format json
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          echo "FAIL: expected mock_sales_extra_export_rows_fail to fail but it passed"
          exit 1
        fi
        echo "Negative case extra_rows failed as expected"
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export negative case (page rows missing from export → must FAIL)
      run: |
        set +e
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_rows_missing.json \
          --artifacts test-results/page_export/mock_rows_missing \
          --output-format json
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          echo "FAIL: expected mock_sales_rows_missing to fail but it passed"
          exit 1
        fi
        echo "Negative case rows_missing failed as expected"
      env:
        FR_MIRROR_ROOT: ./test_mirror

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check with flake8
      run: |
        flake8 scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check scripts tests

  live-page-export:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright pandas
        python -m playwright install chromium --with-deps

    - name: Check auth state exists
      run: |
        if [ -z "$FR_AUTH_STATE_PATH" ] || [ ! -f "$FR_AUTH_STATE_PATH" ]; then
          echo "ERROR: FR_AUTH_STATE_PATH is not set or file not found"
          exit 1
        fi

    - name: Check FR_BASE_URL
      run: |
        if [ -z "$FR_BASE_URL" ]; then
          echo "ERROR: FR_BASE_URL is not set"
          exit 1
        fi

    - name: Run live E2E (verify-export → index → query)
      run: |
        python scripts/runner.py e2e-live \
          --case tests/live_cases/opm_airline_profit_yoy.example.json \
          --auth-state "$FR_AUTH_STATE_PATH" \
          --artifacts test-results/e2e/live \
          --download-mode verified-export
      env:
        FR_MIRROR_ROOT: ./test_mirror
