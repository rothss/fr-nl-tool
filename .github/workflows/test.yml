name: Tests

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # Daily at 02:00 Beijing time

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python -m unittest discover -s tests -p "test_*.py" -v
      env:
        FR_MIRROR_ROOT: ./test_mirror
        FR_BASE_URL: http://localhost:8080

  mock-page-export:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas  # required by mock server fixtures

    - name: Run page-export consistency unit tests
      run: |
        python -m unittest tests.test_page_export_consistency -v

    - name: Install Playwright
      run: |
        pip install playwright
        python -m playwright install chromium --with-deps

    - name: Start mock FR server
      run: |
        python tests/mock_fr_server/server.py --port 18080 &
        sleep 2

    - name: Run verify-export with mock prefix-ordered case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_prefix_ordered.json \
          --artifacts test-results/page_export/mock_prefix \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export with mock visible-subset case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_visible_subset.json \
          --artifacts test-results/page_export/mock_subset \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

    - name: Run verify-export with mock current-page-equal case
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/mock_sales_current_page_equal.json \
          --artifacts test-results/page_export/mock_current_page \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Check with flake8
      run: |
        flake8 scripts tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check formatting with black
      run: |
        black --check scripts tests
      continue-on-error: true

  live-page-export:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright pandas
        python -m playwright install chromium --with-deps

    - name: Run live verify-export
      run: |
        python scripts/runner.py verify-export \
          --case tests/live_cases/opm_airline_profit_yoy.json \
          --auth-state "$FR_AUTH_STATE_PATH" \
          --artifacts test-results/page_export/live \
          --output-format text
      env:
        FR_MIRROR_ROOT: ./test_mirror
      continue-on-error: true
